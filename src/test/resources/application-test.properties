# ── Base de données H2 in-memory ──────────────────────────
spring.datasource.url=jdbc:h2:mem:freelancehub_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / H2 ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.ddl-auto=create-drop
# create-drop : crée les tables au démarrage, les supprime à la fin
# Idéal pour les tests : base propre à chaque exécution

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Désactiver le cache Thymeleaf (si utilisé) ────────────
spring.thymeleaf.cache=false

# ── Port (non utilisé en test mais évite les conflits) ────
server.port=0
# port=0 : Spring choisit un port aléatoire disponible